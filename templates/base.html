<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>MediPlan</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<nav class="navbar mb-4" style="background: white; border-bottom: 3px solid #e74c3c; box-shadow: 0 2px 15px rgba(231,76,60,0.1);">
    <div class="container">
        <a class="navbar-brand fw-800" href="/" style="font-weight: 800; font-size: 1.3rem; color: #c0392b; letter-spacing: -0.5px;">🚑 MediPlan</a>
        {% if session.username %}
        <div class="d-flex align-items-center gap-3">
            <span style="color: #6e6e73;">👤 {{ session.username }}</span>
            <a href="/logout" class="btn btn-outline-danger btn-sm">Ausloggen</a>
        </div>
        {% endif %}
    </div>
</nav>
<div class="container">
    {% block content %}{% endblock %}
</div>
</body>
</html>
